name: Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  agent-review:
    name: Security & Complexity Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml requests

      - name: Detect changed files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE"..."$HEAD" --diff-filter=ACM \
                  | grep -vE '^(env|\.venv|venv|target|dbt_packages|node_modules)/' \
                  | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$FILES" | wc -w | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files ($COUNT): $FILES"

      - name: Run agent on changed files
        id: review
        if: steps.changed.outputs.count != '0'
        run: |
          set +e
          python custom_agent/main.py \
            --mode static \
            --files ${{ steps.changed.outputs.files }} \
            --output agent_pr_report.md \
            --ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: No files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No added/modified files — skipping agent review."

      - name: Build review body
        id: body
        if: steps.changed.outputs.count != '0'
        run: |
          EXIT="${{ steps.review.outputs.exit_code }}"
          REPORT=$(head -c 60000 agent_pr_report.md 2>/dev/null || echo "No report generated.")
          {
            echo "text<<REVIEW_EOF"
            echo "## Agent Code Review"
            echo ""
            if [[ "$EXIT" == "1" ]]; then
              echo "**Changes requested** - CRITICAL or HIGH findings found. Fix before merging."
            else
              echo "**Approved** - no blocking findings."
            fi
            echo ""
            echo "**Scanned:** \`${{ steps.changed.outputs.files }}\`"
            echo ""
            echo "<details><summary>Full findings (click to expand)</summary>"
            echo ""
            echo "$REPORT"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo "_[code-review-agent](https://github.com/ankitajadhav-haptiq/code-review-agent) · Branch: \`${{ github.head_ref }}\`_"
            echo "REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"
          [[ "$EXIT" == "1" ]] && echo "event=REQUEST_CHANGES" >> "$GITHUB_OUTPUT" \
                                || echo "event=COMMENT"         >> "$GITHUB_OUTPUT"

      - name: Submit PR review
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          REVIEW_BODY:  ${{ steps.body.outputs.text }}
          REVIEW_EVENT: ${{ steps.body.outputs.event }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body  = process.env.REVIEW_BODY;
            const event = process.env.REVIEW_EVENT;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            for (const r of reviews) {
              if (r.user.type === 'Bot' && r.state === 'CHANGES_REQUESTED') {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: context.issue.number,
                  review_id: r.id,
                  message: 'Superseded by updated agent review.',
                });
              }
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body, event: event,
            });

      - name: Upload HTML report
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-html
          path: agent_pr_report.html
          retention-days: 30
