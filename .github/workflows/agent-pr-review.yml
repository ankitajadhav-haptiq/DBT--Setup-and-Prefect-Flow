name: Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.sql"
      - "**/*.py"

permissions:
  pull-requests: write
  contents: read

jobs:
  agent-review:
    name: Security & Complexity Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token:      ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet pyyaml requests
          pip install --quiet pip-audit || true

      - name: Detect changed SQL/Python files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE"..."$HEAD" --diff-filter=ACM \
                  | grep -E '\.(sql|py)$' \
                  | grep -v '^env/' \
                  | grep -v '^\.venv/' \
                  | grep -v '^venv/' \
                  | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$FILES" | wc -w | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files ($COUNT): $FILES"

      - name: Run agent review on changed files
        id: review
        if: steps.changed.outputs.count != '0'
        run: |
          python custom_agent/main.py \
            --mode static \
            --files ${{ steps.changed.outputs.files }} \
            --output agent_pr_report.md \
            --ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run full HTML report
        if: steps.changed.outputs.count != '0'
        run: |
          python custom_agent/main.py \
            --files ${{ steps.changed.outputs.files }} \
            --mode static \
            --output agent_pr_report.html \
            --ci || true

      - name: Build review body
        id: body
        if: steps.changed.outputs.count != '0'
        run: |
          EXIT="${{ steps.review.outputs.exit_code }}"
          REPORT_BODY=$(head -c 60000 agent_pr_report.md 2>/dev/null || echo "No report generated.")

          {
            echo "text<<GITHUB_BODY_EOF"
            echo "## 🤖 Agent Code Review"
            echo ""
            if [[ "$EXIT" == "1" ]]; then
              echo "**🚫 Changes requested** — CRITICAL or HIGH findings must be fixed before merging."
            else
              echo "**✅ Approved** — no blocking findings."
            fi
            echo ""
            echo "**Scanned:** \`${{ steps.changed.outputs.files }}\`"
            echo ""
            echo "<details>"
            echo "<summary>📋 Full findings (click to expand)</summary>"
            echo ""
            echo "$REPORT_BODY"
            echo ""
            echo "</details>"
            echo ""
            echo "> 📥 [Download HTML visual report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) from Actions artifacts."
            echo ""
            echo "---"
            echo "_[code-review-agent](https://github.com/ankitajadhav-haptiq/code-review-agent) · Branch: \`${{ github.head_ref }}\`_"
            echo "GITHUB_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$EXIT" == "1" ]]; then
            echo "event=REQUEST_CHANGES" >> "$GITHUB_OUTPUT"
          else
            echo "event=APPROVE"         >> "$GITHUB_OUTPUT"
          fi

      - name: Submit PR review as bot
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          # Use the GitHub App token — review will show as "code-review-agent[bot]"
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body  = `${{ steps.body.outputs.text }}`;
            const event = `${{ steps.body.outputs.event }}`;

            // Dismiss any stale REQUEST_CHANGES review from this bot
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.issue.number,
            });
            for (const r of reviews) {
              if (r.user.login.includes('code-review-agent') && r.state === 'CHANGES_REQUESTED') {
                await github.rest.pulls.dismissReview({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  pull_number: context.issue.number,
                  review_id:   r.id,
                  message:     'Superseded by updated agent review.',
                });
              }
            }

            await github.rest.pulls.createReview({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.issue.number,
              body:        body,
              event:       event,
            });

      - name: Upload HTML visual report
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-html
          path: agent_pr_report.html
          retention-days: 30
