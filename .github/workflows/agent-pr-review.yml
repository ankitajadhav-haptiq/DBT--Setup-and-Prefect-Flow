name: Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_repo:
        description: "Scan the entire repository instead of just a PR's changed files"
        required: false
        default: false
        type: boolean
      pr_number:
        description: "PR number to post the review to (optional — leave blank to just get the report as a build artifact)"
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  agent-review:
    name: Security & Complexity Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml requests

      - name: Detect changed files
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE"..."$HEAD" --diff-filter=ACM \
                  | grep -vE '^(env|\.venv|venv|target|dbt_packages|node_modules)/' \
                  | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$FILES" | wc -w | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files ($COUNT): $FILES"

      - name: No files changed
        if: github.event_name == 'pull_request' && steps.changed.outputs.count == '0'
        run: echo "No added/modified files — skipping agent review."

      - name: Run agent
        id: review
        if: |
          (github.event_name == 'pull_request' && steps.changed.outputs.count != '0') ||
          github.event_name == 'workflow_dispatch'
        run: |
          set +e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python custom_agent/main.py --mode static --full-repo --output agent_pr_report.md --ci
          else
            python custom_agent/main.py --mode static --files ${{ steps.changed.outputs.files }} --output agent_pr_report.md --ci
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build review body
        id: body
        if: steps.review.outcome == 'success'
        run: |
          REPORT=$(head -c 60000 agent_pr_report.md 2>/dev/null || echo "No report generated.")

          # Single source of truth: read the verdict the report itself declares,
          # instead of trusting a separately-captured process exit code that can
          # drift out of sync with what the report actually says.
          VERDICT=$(grep -oE '\*\*Verdict\*\* \| \*\*(BLOCK|WARN|PASS)\*\*' agent_pr_report.md \
                     | grep -oE 'BLOCK|WARN|PASS' | head -1)
          VERDICT="${VERDICT:-PASS}"
          echo "Derived verdict: $VERDICT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCANNED="(full repository scan)"
          else
            SCANNED="${{ steps.changed.outputs.files }}"
          fi

          {
            echo "text<<REVIEW_EOF"
            echo "## Agent Code Review"
            echo ""
            if [[ "$VERDICT" == "BLOCK" ]]; then
              echo "**Changes requested** - CRITICAL findings found. Fix before merging."
            elif [[ "$VERDICT" == "WARN" ]]; then
              echo "**Changes requested** - HIGH findings found. Review before merging."
            else
              echo "**Approved** - no blocking findings."
            fi
            echo ""
            echo "**Scanned:** \`$SCANNED\`"
            echo ""
            echo "<details><summary>Full findings (click to expand)</summary>"
            echo ""
            echo "$REPORT"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo "_[code-review-agent](https://github.com/ankitajadhav-haptiq/code-review-agent) · Branch: \`${{ github.head_ref }}\`_"
            echo "REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$VERDICT" == "PASS" ]]; then
            echo "event=APPROVE" >> "$GITHUB_OUTPUT"
          else
            echo "event=REQUEST_CHANGES" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit PR review
        if: |
          steps.review.outcome == 'success' &&
          (github.event_name == 'pull_request' || inputs.pr_number != '')
        uses: actions/github-script@v7
        env:
          REVIEW_BODY:  ${{ steps.body.outputs.text }}
          REVIEW_EVENT: ${{ steps.body.outputs.event }}
          PR_NUMBER:    ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body        = process.env.REVIEW_BODY;
            const event       = process.env.REVIEW_EVENT;
            const pull_number = parseInt(process.env.PR_NUMBER, 10);

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number,
            });
            for (const r of reviews) {
              if (r.user.type === 'Bot' && r.state === 'CHANGES_REQUESTED') {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number,
                  review_id: r.id,
                  message: 'Superseded by updated agent review.',
                });
              }
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number,
              body: body, event: event,
            });

      - name: Upload HTML report
        if: always() && steps.review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-html
          path: agent_pr_report.html
          retention-days: 30
